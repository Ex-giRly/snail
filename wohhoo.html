<!DOCTYPE html>
<html>

<head>
    <title>Login Form</title>
    <style>
        body {
            background-color: pink;
            padding: 20px;
        }

        


    </style>
</head>

<body>
    <h2>Login Form</h2>
    <form id="loginForm">
        <label for="name">Name:</label>
        <input type="text" id="name" required><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" required><br><br>

        <button type="button" onclick="validateLogin()">Login</button>
    </form>

    <p id="message"></p>

    <script>
        function validateLogin() {
            var name = document.getElementById("name").value;
            var age = document.getElementById("age").value;
            var message = document.getElementById("message");

            if (name.trim() === "") {
                message.textContent = "Name cannot be empty.";
                message.style.color = "red";
                return;
            }

            if (isNaN(age) || age === "") {
                message.textContent = "Please enter a valid age.";
                message.style.color = "red";
                return;
            }

            if (Number(age) >= 18) {
                message.textContent = "Login successful! Welcome, " + name + ".";
                message.style.color = "green";
            } else {
                message.textContent = "Access denied. You must be at least 18 years old.";
                message.style.color = "red";
            }
        }
    </script>
</body>

</html>
